<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulation Produktion Stoppuhr</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/steps.css">
  <link rel="stylesheet" href="css/accordion.css">
  <link rel="stylesheet" href="css/timer-steps.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/appState.js" defer></script>
  <script src="js/stopwatch.js" defer></script>
  <script src="js/storage.js" defer></script>
  <script src="js/steps.js" defer></script>
  <script src="js/accordion.js" defer></script>
  <script src="js/kalkulation.js" defer></script>
  <script src="js/costKalkulation.js" defer></script>
  <script src="js/timer-steps.js" defer></script>
  <script src="js/ui.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>Timer mit Kalkulation</h1>
  </header>
  <main class="container">

    <!-- Arbeitsschritte -->
    <section class="steps-section" aria-labelledby="stepsHeading">

      <h2 id="stepsHeading">Arbeitstitel</h2>

        <div class="job-title-group">
          <div class="job-title-label-row">
            <label for="jobTitleInput">Arbeitstitel</label>
            <button id="btnNewTitle" class="btn-new-title" aria-label="Neuen Arbeitstitel anlegen">Neu</button>
          </div>
          <div class="job-title-row">
            <input
              type="text"
              id="jobTitleInput"
              name="jobTitleInput"
              placeholder="z.B. Rezeptur nachmachen"
              autocomplete="off"
              maxlength="80"
              aria-describedby="jobTitleHint jobTitleError"
              aria-required="true"
              required
            >
            <select
              id="jobTitleSelect"
              aria-label="Gespeicherte Arbeitstitel auswählen"
            >
              <option value="">— Titel auswählen —</option>
            </select>
          </div>
          <span id="jobTitleHint" class="field-hint">Titel eingeben oder aus gespeicherten auswählen</span>
          <span id="jobTitleError" class="field-error hidden" role="alert">Bitte einen Arbeitstitel eingeben.</span>
          <div class="title-action-btns">
            <button
              id="btnEditTitle"
              class="btn-title-edit"
              aria-label="Arbeitstitel bearbeiten"
              title="Titel bearbeiten"
              disabled
            ><i data-lucide="pencil"></i></button>
            <button
              id="btnDeleteTitle"
              class="btn-title-delete"
              aria-label="Arbeitstitel und alle Schritte löschen"
              title="Titel und alle Schritte löschen"
              disabled
            ><i data-lucide="trash-2"></i></button>
            <button
              id="btnSaveTitle"
              class="btn-title-save-main"
              aria-label="Arbeitstitel speichern"
              disabled
            >Speichern</button>
          </div>
        </div>

      <label for="stepInput" class="section-heading">Schritte definieren <br> & Stoppuhr</label>
      <div class="accordion-body">

        <div class="step-input-group">
          <input
            type="text"
            id="stepInput"
            name="stepInput"
            placeholder="z.B. Vorbereitung Utensilien"
            aria-required="false"
            autocomplete="off"
            maxlength="100"
          >
        </div>

        <div class="step-actions" role="group" aria-label="Schritte verwalten">
          <button id="btnAddStep">Weiteren Schritt</button>
          <button id="btnSaveSteps">Speichern</button>
        </div>

        <ol id="stepList" aria-label="Gespeicherte Arbeitsschritte" aria-live="polite"></ol>

        <!-- Session-Buttons -->
        <div class="session-actions" role="group" aria-label="Session steuern">
          <button
            id="btnSessionStart"
            aria-label="Session starten"
          >Stoppuhr starten</button>
        </div>

        <p id="saveConfirm" role="status" aria-live="polite" class="save-confirm hidden"></p>

      </div>

    </section>

    <!-- Kalkulation -->
    <section class="steps-section" aria-label="Kalkulation">

      <label class="section-heading">Kalkulation</label>
      <div class="accordion-body">

     <div class="kalkulation-group">
  <div class="kalkulation-field kalkulation-field--full">
    <label for="importiertTitel">Arbeitstitel</label>
    <div class="job-title-row">
      <input
        type="text"
        id="importiertTitel"
        placeholder="z.B. Rezeptur nachmachen"
        autocomplete="off"
        aria-label="Arbeitstitel"
      >
      <select
        id="kalTitelSelect"
        aria-label="Gespeicherten Arbeitstitel auswählen"
      >
        <option value="">— Titel auswählen —</option>
      </select>
    </div>
  </div>

  <div class="kalkulation-field">
    <label for="importiertZeit">gestoppte Zeit Schritte import:</label>
    <input
      type="text"
      id="importiertZeit"
      readonly
      placeholder="—"
      aria-label="Aus Session importierte Gesamtzeit"
    >
  </div>

  <div class="kalkulation-field">
    <label>Zeit manuell eingeben (Richtwert)</label>
    <div class="zeit-input-row">
      <div class="zeit-col">
        <input type="text" inputmode="numeric" id="zeitStd" maxlength="2" placeholder="00" autocomplete="off" aria-label="Stunden">
        <span class="zeit-unit">Std</span>
      </div>
      <span class="zeit-sep">:</span>
      <div class="zeit-col">
        <input type="text" inputmode="numeric" id="zeitMin" maxlength="2" placeholder="00" autocomplete="off" aria-label="Minuten">
        <span class="zeit-unit">Min</span>
      </div>
      <span class="zeit-sep">:</span>
      <div class="zeit-col">
        <input type="text" inputmode="numeric" id="zeitSek" maxlength="2" placeholder="00" autocomplete="off" aria-label="Sekunden">
        <span class="zeit-unit">Sek</span>
      </div>
    </div>
  </div>

  <div class="kalkulation-field kalkulation-field--full">
    <label for="mwstSatz">MwSt.</label>
    <div class="mwst-row">
      <select id="mwstSatz" name="mwstSatz" aria-label="Mehrwertsteuersatz auswählen">
        <option value="7">7 %</option>
        <option value="19" selected>19 %</option>
        <option value="custom">Manuell...</option>
      </select>
      <input
        type="text"
        inputmode="decimal"
        id="mwstCustom"
        class="hidden"
        placeholder="z.B. 13"
        autocomplete="off"
        maxlength="6"
        aria-label="Eigener Mehrwertsteuersatz in Prozent"
      >
      <span id="mwstCustomUnit" class="mwst-unit hidden">%</span>
    </div>
  </div>

  <div class="kalkulation-field">
    <label for="preisNetto">Preis Netto</label>
    <div class="input-currency">
      <input
        type="text"
        inputmode="decimal"
        id="preisNetto"
        name="preisNetto"
        placeholder="0.00"
        autocomplete="off"
      >
      <span class="currency-symbol">€</span>
    </div>
  </div>

  <div class="kalkulation-field kalkulation-field--result">
    <label for="preisBrutto">Preis Brutto</label>
    <div class="input-currency">
      <input
        type="text"
        inputmode="decimal"
        id="preisBrutto"
        name="preisBrutto"
        placeholder="0.00"
        autocomplete="off"
      >
      <span class="currency-symbol">€</span>
    </div>
  </div>

  <div class="kalkulation-field kalkulation-field--full kalkulation-divider"></div>

  <div class="kalkulation-field kalkulation-field--full">
    <label>Produktionskosten Brutto auf Zeit</label>
    <div class="mwst-row">
      <select id="produktionZeit" aria-label="Produktionszeitraum auswählen">
        <option value="manual">Manuell</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="45">45 min</option>
        <option value="60" selected>60 min</option>
      </select>
      <input
        type="text"
        inputmode="decimal"
        id="produktionManual"
        placeholder="Minuten"
        autocomplete="off"
        maxlength="6"
        aria-label="Manuelle Produktionszeit in Minuten"
      >
      <span class="mwst-unit">min</span>
    </div>
  </div>

  <div class="kalkulation-field kalkulation-field--result">
    <label for="umsatzStunde">Umsatz / Zeit</label>
    <div class="input-currency">
      <input
        type="text"
        id="umsatzStunde"
        readonly
        placeholder="—"
        aria-label="Berechneter Umsatz pro gewähltem Zeitraum"
      >
      <span class="currency-symbol">€</span>
    </div>
  </div>
</div>

      </div>

    </section>

  </main>

  <!-- Session Drawer -->
  <div id="sessionDrawer" class="session-drawer hidden" role="dialog" aria-modal="true" aria-label="Laufende Session">
    <div id="drawerBackdrop" class="session-drawer__backdrop"></div>
    <div class="session-drawer__panel">
      <div class="session-drawer__timer" aria-live="off" aria-atomic="true">
        <span id="drawerTime">00:00:00</span><span id="drawerMillis">.00</span>
      </div>
      <ol id="drawerStepList" class="session-drawer__steps" aria-label="Schritte der Session"></ol>
      <div id="drawerTotal" class="session-drawer__total hidden">
        <span class="session-drawer__total-label">Total</span>
        <span id="drawerTotalTime" class="session-drawer__total-time"></span>
      </div>
      <button id="btnExportKalkulation" class="session-drawer__export hidden">
        Zu Kalkulation exportieren
      </button>
      <div class="session-drawer__actions">
        <button id="btnSessionNext" aria-label="Nächster Schritt">Nächster Schritt</button>
        <button id="btnSessionCancel" aria-label="Session abbrechen">Abbrechen / Stop</button>
      </div>
    </div>
  </div>

</body>
</html>
