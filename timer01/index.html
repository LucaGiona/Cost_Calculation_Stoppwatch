<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stoppuhr</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/stopwatch.js" defer></script>
</head>
<body>
  <div class="container">
    <div id="display">00:00:00<span id="millis">.00</span></div>
    <div class="buttons">
      <button id="btnStart" onclick="start()">Start</button>
      <button id="btnPause" onclick="pause()">Pause</button>
      <button id="btnStop" onclick="stop()">Stopp</button>
    </div>
  </div>
  
</body>
</html>
